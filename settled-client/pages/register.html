<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register — Settled</title>
<link rel="stylesheet" href="../styles/base.css?v=4">
<link rel="stylesheet" href="../styles/auth.css">
</head>
<body>

<div class="auth-page">
    <div class="wordmark-text"><span>Settled.</span></div>

    <div class="auth-card">
        <div class="auth-head">
            <h1>Create your account</h1>
            <p>Start a trip, or join one with an invite code.</p>
        </div>

        <p id="error-message" class="error-text"></p>

        <form id="register-form" action="../../settled-server/api/register-handler.php" method="POST">
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="mayarivera" required>
            </div>

            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>

            <div class="field-row">
                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" minlength="8" required>
                </div>
                <div class="field">
                    <label for="confirm_password">Confirm</label>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="••••••••" minlength="8" required>
                </div>
            </div>
            <p class="field-hint">At least 8 characters</p>

            <button type="submit" class="btn btn-primary">Create account</button>
        </form>

        <div class="auth-switch">
            Already have an account? <a href="login.html">Log in</a>
        </div>
    </div>
</div>

<script src="../scripts/axios.min.js"></script>
<script src="../scripts/helper.js?v=6"></script>
<script src="../scripts/register.js"></script>
</body>
</html>
