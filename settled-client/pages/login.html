<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log In — Settled</title>
<link rel="stylesheet" href="../styles/base.css?v=4">
<link rel="stylesheet" href="../styles/auth.css">
</head>
<body>

<div class="auth-page">
    <div class="wordmark-text"><span>Settled.</span></div>

    <div class="auth-card">
        <div class="auth-head">
            <h1>Welcome back</h1>
            <p>Log in to see what everyone's planning.</p>
        </div>

        <p id="error-message" class="error-text"></p>

        <form id="login-form" action="../../settled-server/api/login-handler.php" method="POST">
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary">Log in</button>
        </form>

        <div class="auth-switch">
            Don't have an account? <a href="register.html">Sign up</a>
        </div>
    </div>
</div>

<script src="../scripts/axios.min.js"></script>
<script src="../scripts/helper.js?v=6"></script>
<script src="../scripts/login.js"></script>
</body>
</html>
